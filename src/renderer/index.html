<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: ws:; media-src 'self' blob: https:"
    />
    <title>Learn Piano</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <form id="search-form">
        <input id="search-input" type="search" placeholder="Buscar música ou colar link da Online Sequencer…" autocomplete="off" />
        <button type="submit">Buscar</button>
        <button id="open-browser" type="button" title="Procurar na Online Sequencer pelo seu navegador; cole aqui o link da sequência escolhida">Navegador</button>
        <button id="import-file" type="button" title="Escolher um .mid do computador e adicioná-lo à biblioteca">Adicionar MIDI</button>
      </form>
      <div class="controls">
        <div class="octave" title="Desloca as notas do seu teclado de 61 teclas (atalhos: Z desce, X sobe)">
          <button id="octave-down" type="button">−</button>
          <span id="octave-label">Oitava 0</span>
          <button id="octave-up" type="button">+</button>
        </div>
        <select id="score-layout" title="Visualização da partitura">
          <option value="line">Linha</option>
          <option value="page">Página</option>
        </select>
        <select id="hand-mode" title="Mão praticada">
          <option value="both">Duas mãos</option>
          <option value="rh">Mão direita</option>
          <option value="lh">Mão esquerda</option>
        </select>
        <button id="play" type="button" title="Tocar a partir do cursor azul (Espaço)">▶ Tocar</button>
        <button id="restart" type="button" title="Reiniciar (R)">Reiniciar</button>
        <label class="toggle"><input id="sound-toggle" type="checkbox" checked /> Som</label>
        <label class="toggle" title="Mostrar o teclado virtual embaixo da partitura"><input id="keyboard-toggle" type="checkbox" checked /> Teclado</label>
        <select id="input-mode" title="De onde vêm as notas que você toca">
          <option value="midi">Entrada: MIDI</option>
          <option value="mic">Entrada: Microfone</option>
        </select>
        <span id="mic-level" class="level" title="Nível do microfone" hidden><i></i></span>
        <span id="midi-status" class="pill">MIDI: procurando…</span>
      </div>
    </header>

    <main>
      <aside>
        <nav>
          <button type="button" data-tab="results" class="active">Resultados</button>
          <button type="button" data-tab="library">Biblioteca</button>
        </nav>
        <ul id="song-list"></ul>
        <div id="pager" hidden>
          <button type="button" id="prev-page">‹</button>
          <span id="page-label"></span>
          <button type="button" id="next-page">›</button>
        </div>
      </aside>

      <section id="stage">
        <div id="stats"><span id="song-title">Nenhuma música</span><span id="stats-text"></span></div>
        <div id="status"></div>
        <nav id="view-tabs">
          <button type="button" data-view="sheet" class="active">Partitura</button>
          <button type="button" data-view="theory">Teoria</button>
        </nav>
        <div id="view">
          <div id="sheet-wrap"><div id="sheet"></div></div>
          <div id="theory" hidden></div>
        </div>
      </section>
    </main>

    <div id="keyboard"></div>

    <dialog id="track-dialog">
      <form method="dialog">
        <h2>Trilhas do MIDI</h2>
        <p class="hint">Marque as trilhas de piano. Bateria e trilhas vazias ficam de fora.</p>
        <ul id="track-list"></ul>
        <label>
          Separar mãos
          <select id="split-mode">
            <option value="auto">Automático</option>
            <option value="tracks">Por trilha (aguda = direita)</option>
            <option value="pitch">Pela altura (Dó central)</option>
          </select>
        </label>
        <menu>
          <button value="cancel" formnovalidate>Cancelar</button>
          <button value="ok" class="primary">Abrir partitura</button>
        </menu>
      </form>
    </dialog>

    <dialog id="title-dialog">
      <form method="dialog">
        <h2>Sequência da Online Sequencer</h2>
        <p class="hint">O site não informa o nome pela API. Como a música deve aparecer na biblioteca?</p>
        <input id="title-input" type="text" required autocomplete="off" />
        <menu>
          <button value="cancel" formnovalidate>Cancelar</button>
          <button value="ok" class="primary">Importar</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
