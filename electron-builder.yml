appId: dev.piedro.learnpiano
productName: Learn Piano
executableName: learn-piano
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
artifactName: learn-piano-${version}-${os}-${arch}.${ext}
linux:
  target: [deb, pacman]
  category: AudioVideo;Audio;Music
  icon: build/icon.png
  synopsis: Aprenda piano com partitura, MIDI e microfone
  description: Pratique piano no modo espera, com partitura gerada de MIDI, teclado MIDI ou microfone.
  desktop:
    entry:
      StartupWMClass: learn-piano
# electron-builder's default pacman list includes libappindicator-gtk3, which Arch no longer ships.
pacman:
  depends: [gtk3, nss, alsa-lib, libxss, libxtst, libnotify, xdg-utils]
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: learn-piano-${version}-windows-setup.${ext}
